<!DOCTYPE html>
<html lang="ko">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-5YW0T2C109"></script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>악기 퍼즐킹</title>
<meta name="description" content="동작하는 악기 소리와 함께하는 2인용 악기 매치 퍼즐 게임">
<meta name="keywords" content="악기, 퍼즐, 게임, 관악기, 현악기, 타악기, 음악 교육">

<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;900&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>
    :root {
        --app-height: 100vh;
        --primary-gold: #ffd700;
        --bg-dark: #0a0a0c;
        --panel-bg: rgba(22, 22, 27, 0.95);
        --neon-blue: #00f0ff;
        --neon-red: #ff0055;
    }

    html, body {
        margin: 0; padding: 0; overflow: hidden;
        background-color: var(--bg-dark);
        font-family: 'Outfit', 'Noto Sans KR', sans-serif;
        width: 100%; height: 100vh; height: var(--app-height);
        touch-action: none; 
        -webkit-user-select: none; user-select: none;
        -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    }

    body { display: flex; flex-direction: column; color: #fff; }

    #langSelectorContainer {
        position: absolute; top: 15px; right: 15px; z-index: 99999 !important;
    }
    .custom-scrollbar::-webkit-scrollbar { width: 8px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: rgba(31, 41, 55, 0.5); border-radius: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #6b7280; }

    .resize-text { white-space: nowrap; transition: font-size 0.2s ease; padding-bottom: 5px; }

    /* --- 게임 탑 영역 스타일 --- */
    #top-area {
        flex: 0 0 25%; min-height: 120px;
        background: linear-gradient(180deg, #121216 0%, #08080a 100%);
        border-bottom: 4px solid var(--primary-gold);
        display: flex; justify-content: center; align-items: center;
        position: relative; z-index: 10; box-shadow: 0 10px 30px rgba(0,0,0,0.7);
    }
    #scoreboard-row { display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 0 20px; height: 100%; }
    .player-group { display: flex; align-items: center; gap: 15px; height: 100%; flex: 1; }
    .p1-group { justify-content: flex-start; } 
    .p2-group { justify-content: flex-end; }   
    .ref-img-large { 
        height: 85%; max-height: 120px; min-height: 90px; aspect-ratio: auto;
        border: 4px solid var(--primary-gold); border-radius: 12px; 
        background: #000; overflow: hidden; box-shadow: 0 5px 20px rgba(0,0,0,0.6);
        display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .ref-img-large img { width: 100%; height: 100%; object-fit: cover; }
    .player-zone {
        display: flex; align-items: center; gap: 15px; padding: 10px 25px;
        border-radius: 20px; background: rgba(255,255,255,0.03);
        min-width: 200px; justify-content: center; box-shadow: 0 5px 15px rgba(0,0,0,0.4);
    }
    .p1-zone { border: 3px solid var(--neon-red); color: var(--neon-red); text-shadow: 0 0 10px rgba(255,0,85,0.5); }
    .p2-zone { border: 3px solid var(--neon-blue); color: var(--neon-blue); flex-direction: row-reverse; text-shadow: 0 0 10px rgba(0,240,255,0.5); } 
    .player-label { font-size: clamp(20px, 2.5vw, 30px); font-weight: 900; }
    .score { font-size: clamp(40px, 4vw, 60px); font-weight: 950; margin: 0 10px; line-height: 1; }
    .center-info { flex: 0 0 auto; display: flex; align-items: center; justify-content: center; padding: 0 20px; }
    .timer-container { text-align: center; width: 150px; }
    .timer-label { color: var(--primary-gold); font-size: clamp(16px, 1.8vw, 24px); margin-bottom: 8px; font-weight: 900; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
    #timer-bar { width: 100%; height: 14px; background: #222; border-radius: 7px; overflow: hidden; border: 2px solid #444; }
    #timer-fill { width: 0%; height: 100%; background: linear-gradient(90deg, var(--neon-red), var(--primary-gold), #4cd964); transition: width 1s linear; }

    /* --- 게임 영역 스타일 --- */
    #game-area-wrapper { flex: 1; display: flex; justify-content: center; align-items: center; padding: 15px; background-color: #050507; position: relative; overflow: hidden; }
    #game-area { width: 100%; height: 100%; display: flex; position: relative; gap: 20px; }
    .table-bg { flex: 1; border-radius: 20px; border: 8px solid #221a15; box-shadow: inset 0 0 60px rgba(0,0,0,0.9), 0 10px 25px rgba(0,0,0,0.6); position: relative; display: flex; justify-content: center; align-items: center; }
    .left-table { background: radial-gradient(circle at 30% 30%, #2c1a1d 0%, #0d0607 90%); }
    .right-table { background: radial-gradient(circle at 70% 30%, #151e2b 0%, #05080e 90%); }
    .divider { position: absolute; left: 50%; top: 10px; bottom: 10px; width: 6px; background: rgba(255, 215, 0, 0.25); transform: translateX(-50%); z-index: 4; border-radius: 3px; }

    /* --- 보드 및 조각 스타일 --- */
    .board { position: relative; background: rgba(0, 0, 0, 0.6); box-shadow: 0 15px 40px rgba(0,0,0,0.9); border: 4px solid var(--primary-gold); box-sizing: content-box; overflow: hidden; border-radius: 12px; }
    .puzzle-piece { position: absolute; box-sizing: border-box; border: 1px solid rgba(255, 255, 255, 0.15); background-repeat: no-repeat; transition: left 0.15s ease-out, top 0.15s ease-out; touch-action: none; cursor: grab; }
    .puzzle-piece.dragging { transition: none; z-index: 100; outline: 4px solid var(--primary-gold); box-shadow: 0 25px 50px rgba(0,0,0,0.8); cursor: grabbing; opacity: 0.95; }

    /* --- 플로팅 및 오버레이 버튼 --- */
    .float-btn { position: fixed; bottom: 20px; width: 55px; height: 55px; background: rgba(255, 255, 255, 0.08); border: 2px solid rgba(255, 255, 255, 0.3); border-radius: 50%; cursor: pointer; z-index: 1000; display: flex; justify-content: center; align-items: center; color: white; font-size: 24px; transition: all 0.2s; backdrop-filter: blur(8px); box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
    .float-btn:hover { background: rgba(255, 255, 255, 0.2); transform: scale(1.1); border-color: var(--primary-gold); }
    .float-btn:active { transform: scale(0.95); }
    #fullscreen-btn { right: 20px; }
    #btn-home { left: 20px; }

    .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(5,5,7,0.92); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; backdrop-filter: blur(12px); }
    .modal-content { background: var(--panel-bg); padding: 25px 35px; border-radius: 30px; border: 2px solid rgba(255, 215, 0, 0.3); display: flex; flex-direction: column; align-items: center; max-width: 950px; width: 95%; max-height: 95vh; overflow-y: auto; box-shadow: 0 25px 60px rgba(0,0,0,0.9); }
    .modal-content::-webkit-scrollbar { width: 8px; }
    .modal-content::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; }

    h1 { font-size: clamp(35px, 5vw, 60px) !important; margin: 0 0 15px 0; font-weight: 900; background: linear-gradient(to bottom, #ffffff, var(--primary-gold)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.4)); line-height: 1.2; word-break: keep-all; text-align: center; letter-spacing: -1px; }

    /* --- 탭 메뉴 스타일 (4개 탭) --- */
    .tab-container { display: flex; background: rgba(0,0,0,0.6); border-radius: 35px; padding: 6px; margin-bottom: 20px; width: 100%; max-width: 750px; gap: 4px; box-shadow: inset 0 2px 8px rgba(0,0,0,0.8); }
    .tab-btn { flex: 1; padding: 12px 6px; font-size: clamp(13px, 1.8vw, 17px); font-weight: 900; color: #888; background: transparent; border: none; border-radius: 30px; cursor: pointer; transition: all 0.3s; text-align: center; }
    .tab-btn.active { background: var(--primary-gold); color: #000; box-shadow: 0 4px 15px rgba(255, 215, 0, 0.4); }
    .tab-content { width: 100%; display: none; flex-direction: column; align-items: center; margin-bottom: 20px; }
    .tab-content.active { display: flex; animation: fadeIn 0.3s ease-in-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    /* --- 갤러리 리스트 스타일 --- */
    .gallery-wrapper { width: 100%; max-width: 850px; background: rgba(0,0,0,0.4); padding: 20px; border-radius: 20px; border: 1px solid #333; }
    .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; max-height: 32vh; overflow-y: auto; padding-right: 5px; }
    .gallery-grid::-webkit-scrollbar { width: 6px; }
    .gallery-grid::-webkit-scrollbar-thumb { background: var(--primary-gold); border-radius: 4px; }
    
    .gallery-item { position: relative; border-radius: 12px; overflow: hidden; border: 3px solid transparent; cursor: pointer; transition: all 0.25s; background: #1a1a22; display: flex; flex-direction: column; height: 125px; box-shadow: 0 5px 15px rgba(0,0,0,0.4); }
    .gallery-item img { width: 100%; height: 85px; object-fit: cover; background: #222; }
    .gallery-item .g-title { padding: 6px; font-size: 13px; font-weight: 700; text-align: center; color: #ddd; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .gallery-item:hover { transform: translateY(-4px); border-color: rgba(255, 215, 0, 0.5); }
    .gallery-item.active { border-color: var(--primary-gold); box-shadow: 0 0 15px rgba(255, 215, 0, 0.6); }

    .random-box { width: 100%; max-width: 500px; border-radius: 28px; padding: 30px 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 15px; border: 3px dashed var(--primary-gold); background: rgba(255, 215, 0, 0.03); }
    .random-mark { font-size: 90px; font-weight: 950; color: var(--primary-gold); line-height: 1; text-shadow: 0 0 30px rgba(255, 204, 0, 0.6); animation: floatRandom 2s ease-in-out infinite; }
    @keyframes floatRandom { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

    /* --- 게임 설정 스타일 --- */
    .settings-row { display: flex; flex-direction: row; flex-wrap: wrap; gap: 20px; justify-content: center; width: 100%; margin-bottom: 25px; }
    .setting-group { display: flex; flex-direction: row; align-items: center; gap: 12px; background: rgba(0,0,0,0.5); padding: 8px 20px; border-radius: 35px; box-shadow: 0 4px 10px rgba(0,0,0,0.4); }
    .setting-title { font-size: 16px; color: var(--primary-gold); font-weight: 900; white-space: nowrap; }
    .opt-group { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
    .opt-btn { padding: 6px 15px; font-size: 15px; font-weight: 900; background: rgba(255, 255, 255, 0.05); border: 2px solid #555; border-radius: 12px; color: #ccc; cursor: pointer; transition: all 0.2s; }
    .opt-btn:hover { background: rgba(255, 255, 255, 0.15); border-color: #888; }
    .opt-btn.active { background: var(--primary-gold); color: #000; border-color: var(--primary-gold); box-shadow: 0 0 10px rgba(255, 215, 0, 0.5); }

    .start-game-btn { padding: 14px 90px; font-size: 28px; font-weight: 950; background: linear-gradient(to bottom, var(--primary-gold), #ffa500); border: 3px solid #fff; border-radius: 60px; color: #111; cursor: pointer; box-shadow: 0 12px 35px rgba(255, 165, 0, 0.4); transition: transform 0.1s, box-shadow 0.2s; }
    .start-game-btn:hover { transform: scale(1.05); box-shadow: 0 15px 45px rgba(255, 165, 0, 0.6); }
    .start-game-btn:active { transform: scale(0.95); }

    .other-game-link { margin-top: 15px; color: #888; text-decoration: none; font-size: 15px; border-bottom: 1px solid #555; padding-bottom: 2px; transition: color 0.2s; }
    .other-game-link:hover { color: #fff; border-color: #fff; }

    #end-artwork { max-height: 45vh; max-width: 100%; object-fit: cover; border: 8px solid var(--primary-gold); border-radius: 16px; box-shadow: 0 20px 50px rgba(0,0,0,0.8); margin-bottom: 20px; }
    .diff-btn { padding: 12px 35px; font-size: 20px; font-weight: 900; background: #1a1a24; border: 2px solid #555; border-radius: 18px; color: #fff; cursor: pointer; transition: all 0.2s; }
    .diff-btn:hover { border-color: var(--primary-gold); transform: scale(1.05); box-shadow: 0 5px 15px rgba(255,215,0,0.2); }

    .loading-spinner { border: 6px solid #222; border-top: 6px solid var(--primary-gold); border-radius: 50%; width: 60px; height: 60px; animation: spin 1s linear infinite; margin: 20px auto; }
    @keyframes spin { 0% { transform: rotate(0) } 100% { transform: rotate(360deg) } }
    .hidden { display: none !important; }

    /* --- 악기 상세 패널 --- */
    .info-panel {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(8, 8, 10, 0.95); color: white;
        display: flex; flex-direction: column; justify-content: center; align-items: center;
        box-sizing: border-box; text-align: center; border-radius: 0; 
        opacity: 0; transition: opacity 0.5s ease-in-out; z-index: 50;
        backdrop-filter: blur(8px);
    }
    .info-panel.visible { opacity: 1; }
    .info-content {
        padding: 25px; width: 100%; max-height: 100%; overflow-y: auto;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    .info-content::-webkit-scrollbar { width: 6px; }
    .info-content::-webkit-scrollbar-thumb { background: var(--primary-gold); border-radius: 4px; }
    .info-title { font-size: clamp(22px, 3.5vw, 48px); font-weight: 950; color: var(--primary-gold); margin-bottom: 5px; text-shadow: 0 0 15px rgba(255,215,0,0.3); }
    .info-category { font-size: clamp(16px, 2.5vw, 26px); color: #aaa; margin-bottom: 20px; font-weight: 700; }
    .info-desc { font-size: clamp(14px, 1.8vw, 18px); line-height: 1.6; word-break: keep-all; margin-bottom: 25px; color: #e5e5ed; max-width: 600px; }

    /* --- 퀴즈 패널 스타일 (3지선다) --- */
    .quiz-panel {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(5,5,8,0.92); display: flex; flex-direction: column;
        justify-content: center; align-items: center; z-index: 200; backdrop-filter: blur(8px);
    }
    .quiz-title { font-size: clamp(18px, 2.5vw, 30px); color: var(--primary-gold); font-weight: 950; margin-bottom: 25px; text-align:center; word-break: keep-all; padding: 0 15px; line-height: 1.4; text-shadow: 0 0 10px rgba(255,215,0,0.2); }
    .quiz-btn-group { display: flex; gap: 15px; flex-direction: column; width: 80%; max-width: 320px; }
    .quiz-btn { padding: 14px 20px; font-size: clamp(16px, 2vw, 22px); font-weight: 900; border-radius: 16px; border: 2px solid var(--primary-gold); background: #15151a; color: #fff; cursor: pointer; transition: all 0.2s; box-shadow: 0 4px 10px rgba(0,0,0,0.5); text-align: center; }
    .quiz-btn:hover { background: var(--primary-gold); color: #000; transform: scale(1.03); box-shadow: 0 0 15px rgba(255, 215, 0, 0.4); }

    /* --- 오답 피드백 스타일 --- */
    .wrong-feedback {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: rgba(255, 0, 85, 0.95);
        color: white;
        padding: 15px 35px;
        border-radius: 16px;
        font-size: clamp(18px, 2.5vw, 28px);
        font-weight: 900;
        z-index: 300;
        box-shadow: 0 15px 35px rgba(0,0,0,0.7);
        border: 2px solid #ffccd5;
        pointer-events: none;
        animation: fadeUpOut 2s ease-in-out forwards;
        white-space: nowrap;
    }

    @keyframes fadeUpOut {
        0% { opacity: 0; transform: translate(-50%, -40%); }
        15% { opacity: 1; transform: translate(-50%, -50%); }
        80% { opacity: 1; transform: translate(-50%, -50%); }
        100% { opacity: 0; transform: translate(-50%, -60%); }
    }

    /* --- 다국어 모달 및 언어 선택기 전용 격리 스타일 --- */
    #langModal, #langModal * {
        box-sizing: border-box !important;
    }

    /* Font Awesome 아이콘 깨짐 방지: 폰트 어썸 클래스는 고유 서체 강제 지정 */
    #langModal .fa, #langModal .fas, #langModal .far, #langModal .fa-solid, #langModal .fa-regular, #langModal .fa-brands,
    #langSelectorContainer .fa, #langSelectorContainer .fa-solid,
    #toastNotification .fa, #toastNotification .fa-solid {
        font-family: 'Font Awesome 6 Free', 'Font Awesome 6 Brands' !important;
        font-style: normal;
        font-weight: 900;
    }

    /* 모달 레이어 최상단 고정 (z-index 99999) */
    .modal-overlay-lang {
        position: fixed;
        inset: 0;
        z-index: 99999 !important;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: rgba(0, 0, 0, 0.75);
        backdrop-filter: blur(5px);
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.25s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        padding: 16px;
    }
    .modal-overlay-lang.active {
        opacity: 1;
        visibility: visible;
    }
    
    .modal-content-lang {
        background-color: #0f0f13;
        border: 2px solid #2e3039;
        border-radius: 24px;
        width: 100%;
        max-width: 850px;
        max-height: 80vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        transform: scale(0.95) translateY(-10px);
        transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .modal-overlay-lang.active .modal-content-lang {
        transform: scale(1) translateY(0);
    }

    /* 토스트 알림 z-index 및 레이아웃 */
    .toast-lang {
        position: fixed;
        bottom: 24px;
        right: 24px;
        z-index: 99999 !important;
        background-color: #1a1a22;
        border: 2px solid #2e3039;
        border-radius: 16px;
        padding: 16px 20px;
        box-shadow: 0 15px 35px rgba(0,0,0,0.6);
        display: flex;
        align-items: center;
        gap: 14px;
        transform: translateY(150%);
        opacity: 0;
        transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .toast-lang.show {
        transform: translateY(0);
        opacity: 1;
    }
</style>
</head>
<body>
    
    <!-- 글로벌 언어 선택기 버튼 -->
    <div id="langSelectorContainer">
        <button id="langTriggerBtn" class="flex items-center gap-2 bg-gray-800/80 hover:bg-gray-700 border border-gray-600 rounded-full px-4 py-2 transition-all duration-200 text-sm font-medium shadow-lg text-white">
            <i class="fa-solid fa-globe text-gray-400"></i>
            <img id="currentFlag" src="https://flagcdn.com/w40/kr.png" alt="KR" class="w-5 h-auto rounded-[2px] shadow-sm">
            <span id="currentLangName" class="hidden sm:inline-block">한국어</span>
            <i class="fa-solid fa-chevron-down text-gray-400 ml-1 text-xs"></i>
        </button>
    </div>

    <!-- 다국어 선택 모달 -->
    <div id="langModal" class="modal-overlay-lang">
        <div class="modal-content-lang">
            <div class="flex items-center justify-between p-5 border-b border-gray-800 bg-gray-900/95 sticky top-0 z-10">
                <div>
                    <h2 class="text-xl font-bold text-white flex items-center gap-2">
                        <i class="fa-solid fa-language text-yellow-500"></i>
                        <span>Language / 언어</span>
                    </h2>
                </div>
                <button id="closeModalBtn" class="w-10 h-10 rounded-full bg-gray-800 hover:bg-gray-700 flex items-center justify-center text-gray-400 hover:text-white transition-colors">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <div class="p-5 pb-2 bg-gray-900">
                <div class="relative">
                    <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                    <input type="text" id="searchInput" placeholder="Search / 검색 ..." 
                        class="w-full bg-gray-800 border border-gray-700 text-white text-sm rounded-xl focus:ring-2 focus:ring-yellow-500 focus:border-yellow-500 block pl-11 p-3.5 outline-none transition-all placeholder-gray-500">
                </div>
            </div>

            <div class="p-5 overflow-y-auto custom-scrollbar flex-1 bg-gray-900">
                <div id="languageGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-3">
                    <!-- 언어 목록 렌더링 영역 -->
                </div>
                <div id="noResult" class="hidden flex-col items-center justify-center py-12 text-gray-500">
                    <i class="fa-regular fa-face-frown-open text-4xl mb-3"></i>
                    <p>No results / 검색 결과 없음</p>
                </div>
            </div>
        </div>

    ];

    function detectLanguage() {
        const urlParams = new URLSearchParams(window.location.search);
        let lang = urlParams.get('lang');
        
        if (!lang) {
            lang = localStorage.getItem('kingsmath_lang');
        }
        
        if (!lang && navigator.language) {
            const browserLang = navigator.language.toLowerCase();
            const matchedLang = languages.find(l => browserLang.startsWith(l.code));
            if (matchedLang) {
                lang = matchedLang.code;
            }
        }
        
        if (!lang || !languages.some(l => l.code === lang)) {
            lang = 'en';
        }
        
        return lang;
    }

    let currentGlobalLang = detectLanguage();

    function getLocalizedInstrumentName(id, fallbackName) {
        if (instrumentNamesTranslations[id] && instrumentNamesTranslations[id][currentGlobalLang]) {
            return instrumentNamesTranslations[id][currentGlobalLang];
        }
        return fallbackName;
    }

    function getLocalizedCategory(category) {
        const dict = i18n[currentGlobalLang] || i18n['en'];
        if (category === '관악기') return dict.tab_wind || category;
        if (category === '현악기') return dict.tab_string || category;
        if (category === '타악기') return dict.tab_percussion || category;
        return category;
    }

        currentGlobalLang = langCode;
        
        const dict = i18n[langCode] || i18n['en'];
        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.getAttribute('data-i18n');
            if (dict[key]) {

        document.title = dict.title || "악기 퍼즐킹";

            document.head.appendChild(metaDesc);

        metaDesc.content = dict.meta_desc || "동작하는 악기 소리와 함께하는 2인용 악기 매치 퍼즐 게임";
        
        let metaKey = document.querySelector('meta[name="keywords"]');
        if (!metaKey) {
            metaKey = document.createElement('meta');
            metaKey.name = "keywords";
            document.head.appendChild(metaKey);
        }
        metaKey.content = dict.meta_keywords || "악기, 퍼즐, 게임, 관악기, 현악기, 타악기, 음악 교육";
        
        const langObj = languages.find(l => l.code === langCode) || languages.find(l => l.code === 'en');
        const currentFlagImg = document.getElementById('currentFlag');
        const currentLangSpan = document.getElementById('currentLangName');
        if (currentFlagImg) currentFlagImg.src = `https://flagcdn.com/w40/${langObj.country}.png`;

        adjustTextSizes();

    function adjustTextSizes() {
        document.querySelectorAll('.resize-text').forEach(el => {
            const parent = el.parentElement;
            if (!parent || parent.clientWidth === 0) return; // 숨겨진 요소는 폰트가 10px로 축소되는 현상 방지
            
            el.style.fontSize = ''; 
            const computedStyle = window.getComputedStyle(el);
            let fontSize = parseFloat(computedStyle.fontSize);
            
            let limit = 0;
            while (el.scrollWidth > parent.clientWidth && fontSize > 10 && limit < 15) {
                fontSize -= 1;
                el.style.fontSize = fontSize + 'px';
                limit++;
            }
        });
    }

    // --- 오디오 엔진 고도화 ---
    const AudioEngine = {
        currentAudio: null,
        stopTimeout: null,

        playStart: function() {
            // 게임 시작 시 짧은 비프음 효과
            this.playSynthTone(800, 0.2);
        },
        playClack: function() {
            // 조각 맞추는 소리
            this.playSynthTone(300, 0.05);
        },
        playWrong: function() {
            // 오답 시 뚜-웅 소리
            this.playSynthTone(220, 0.4);
        },

        // Web Audio API를 활용한 효과음 합성
        playSynthTone: function(freq, duration) {
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                const ctx = new AudioCtx();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.frequency.setValueAtTime(freq, ctx.currentTime);
                gain.gain.setValueAtTime(0.15, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + duration);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + duration);
            } catch(e) {
                console.log("AudioContext not supported or suspended", e);
            }
        },

        // 실제 악기 MP3 재생 (최대 10초)
        playInstrumentSound: function(samplePath) {
            this.stopInstrumentSound(); // 이미 재생 중인 사운드가 있다면 중지
            
            console.log("Playing instrument sample:", samplePath);
            try {
                this.currentAudio = new Audio(samplePath);
                this.currentAudio.volume = 0.8;
                
                // 재생 시작
                this.currentAudio.play().catch(err => {
                    console.log("Audio playback failed (interaction required):", err);
                });

                // 정확히 10초 후에 정지 및 페이드아웃 효과 구현
                this.stopTimeout = setTimeout(() => {
                    this.fadeOutAndStop();
                }, 10000); // 10초

            } catch (e) {
                console.error("Failed to load instrument sound:", e);
            }
        },

        // 볼륨 페이드아웃 및 중지
        fadeOutAndStop: function() {
            if (!this.currentAudio) return;
            let vol = this.currentAudio.volume;
            const fadeInterval = setInterval(() => {
                if (this.currentAudio && vol > 0.05) {
                    vol -= 0.05;
                    this.currentAudio.volume = Math.max(0, vol);
                } else {
                    clearInterval(fadeInterval);
                    this.stopInstrumentSound();
                }
            }, 50); // 50ms 마다 0.05씩 볼륨 감소
        },

        // 즉시 중지
        stopInstrumentSound: function() {
            if (this.stopTimeout) {
                clearTimeout(this.stopTimeout);
                this.stopTimeout = null;
            }
            if (this.currentAudio) {
                this.currentAudio.pause();
                this.currentAudio.currentTime = 0;
                this.currentAudio = null;
            }
        }
    };

    // --- 갤러리 렌더링 ---
    function initGallery() {

            if(idx === 0 && !selectedGalleryItem) selectedGalleryItem = inst;
            
            el.className = 'gallery-item' + isActive; 
            el.id = 'gallery-item-' + idx;
            
            const localizedName = getLocalizedInstrumentName(inst.id, inst.name);
            // 이미지 주소 설정 및 엑박 방지 onerror 핸들러 삽입

                <img src="${inst.image_path}" alt="${localizedName}" onerror="this.onerror=null; this.src='img/violin.webp';">
                <div class="g-title resize-text">${localizedName}</div>

        const target = document.getElementById('gallery-item-' + idx);
        if(target) target.classList.add('active');
        selectedGalleryItem = instrumentsDB[idx];
    }

    // --- 이미지 프리로드 및 게임 로딩 ---
    function setGameImageAndStart(item) {
        gameState.imgReady = false; 
        gameState.imgData = item;
        const img = new Image();

        // 2초 로딩 타임아웃 감지 및 교체
        const loadingTimeout = setTimeout(() => {
            if (!gameState.imgReady && currentMode === 'random') {
                console.log("⏳ 이미지 로딩 지연. 다른 악기로 교체합니다.");
                img.src = ""; 
                let newItem;
                do {
                    newItem = instrumentsDB[Math.floor(Math.random() * instrumentsDB.length)];
                } while (newItem.id === item.id);
                setGameImageAndStart(newItem);
            } else if (!gameState.imgReady && currentMode !== 'random') {
                alert("해당 악기의 이미지를 로드할 수 없습니다. 다른 악기를 선택해 주세요.");
                document.getElementById('btn-home').click();
            }
        }, 2500);

        img.onload = () => {
            clearTimeout(loadingTimeout);
            gameState.imgRatio = img.naturalWidth / img.naturalHeight;
            
            document.querySelectorAll('.ref-image').forEach(el => el.src = item.image_path);
            document.getElementById('end-artwork').src = item.image_path;
            document.getElementById('end-title').textContent = getLocalizedInstrumentName(item.id, item.name);
            document.getElementById('end-category').textContent = getLocalizedCategory(item.category);
            
            gameState.imgReady = true;
        };

        img.onerror = () => {
            clearTimeout(loadingTimeout);
            // 만약 실제 악기 이미지가 없다면 바이올린 이미지를 기본값으로 지정하여 퍼즐을 정상 구동
            console.log("❌ 이미지 경로 없음. 기본 바이올린 이미지로 자동 우회 처리합니다.");
            img.src = 'img/violin.webp'; 
            
            // 데이터 정보는 원래 악기 정보를 보존하되 이미지 링크만 우회
            document.querySelectorAll('.ref-image').forEach(el => el.src = 'img/violin.webp');
            document.getElementById('end-artwork').src = 'img/violin.webp';
            document.getElementById('end-title').textContent = getLocalizedInstrumentName(item.id, item.name);
            document.getElementById('end-category').textContent = getLocalizedCategory(item.category);
            
            gameState.imgReady = true;
        };

        img.src = item.image_path;
    }

    // --- 시작 연출 시퀀스 ---
    function startSequence() {
        let targetItem = null;
        if (currentMode === 'random') {
            targetItem = instrumentsDB[Math.floor(Math.random() * instrumentsDB.length)];
        } else { 
            targetItem = selectedGalleryItem;
        }

        setGameImageAndStart(targetItem);
        gameState.gridSize = selectedGrid; 
        gameState.timeLimit = selectedTime; 
        gameState.timeRemaining = selectedTime;

        document.getElementById('overlay-start').classList.add('hidden');
        document.getElementById('langSelectorContainer').style.display = 'none';
        
        const countOverlay = document.getElementById('overlay-countdown'); 
        countOverlay.classList.remove('hidden');
        
        let count = 5;
        const countNum = document.getElementById('countdown-number');
        const spinner = document.getElementById('loading-indicator');
        const countText = document.getElementById('countdown-text');
        const rememberText = document.getElementById('countdown-remember');
        const countImg = document.getElementById('countdown-image');

        countNum.classList.add('hidden'); 
        spinner.classList.remove('hidden');
        countText.classList.remove('hidden');
        countImg.style.display = 'none';
        rememberText.classList.add('hidden');

        const checkReadyIntv = setInterval(() => {
            if(gameState.imgReady) {
                clearInterval(checkReadyIntv);
                
                spinner.classList.add('hidden');
                countText.classList.add('hidden');
                
                countImg.src = gameState.imgData.image_path;
                countImg.style.display = 'block';
                
                // 악기명 노출 및 초기 안내
                const instNameEl = document.getElementById('countdown-inst-name');
                instNameEl.textContent = getLocalizedInstrumentName(gameState.imgData.id, gameState.imgData.name);
                instNameEl.classList.remove('hidden');
                
                rememberText.textContent = i18n[currentGlobalLang].remember_pic || "그림을 잘 기억하세요";
                rememberText.classList.remove('hidden');
                
                // 로딩이 완료되면 즉시 고유 악기 음원 재생 (5초 동안)
                AudioEngine.playInstrumentSound(gameState.imgData.sample_path);
                
                countNum.textContent = count;
                countNum.classList.remove('hidden');
                
                const intv = setInterval(() => {
                    count--;
                    if (count > 0) { 
                        countNum.textContent = count; 
                        
                        // 3초 이하(카운트 3, 2, 1)일 때는 악기명을 가리고 문구를 그림 집중으로 변경

                        
                        AudioEngine.playSynthTone(1000, 0.1); 
                    } else {
                        clearInterval(intv); 
                        
                        // 게임 판 구동 전에 카운트다운용 음악을 강제 정지
                        AudioEngine.stopInstrumentSound();
                        
                        countOverlay.classList.add('hidden'); 
                        startGame();
                    }
                }, 1000);
            }
        }, 200);
    }

    // --- 본격 게임 기동 ---
    function startGame() {
        AudioEngine.playStart();
        initBoard('p1'); 
        initBoard('p2'); 
        resizeBoards();
        
        gameState.isPlaying = true; 
        gameState.timeElapsed = 0;
        document.getElementById('score-p1').textContent = '0%'; 
        document.getElementById('score-p2').textContent = '0%';

        if(gameState.timerIntv) clearInterval(gameState.timerIntv);
        const timerFill = document.getElementById('timer-fill'); 
        const txtTimer = document.getElementById('txt-timer');
        
        if (gameState.timeLimit > 0) {
            timerFill.style.width = '100%'; 
            timerFill.style.transition = 'width 1s linear';
            gameState.timerIntv = setInterval(() => {
                gameState.timeRemaining--;
                const m = String(Math.floor(gameState.timeRemaining / 60)).padStart(2, '0');
                const s = String(gameState.timeRemaining % 60).padStart(2, '0');
                txtTimer.textContent = `${m}:${s}`;
                const pct = (gameState.timeRemaining / gameState.timeLimit) * 100;
                timerFill.style.width = `${pct}%`;

                if (gameState.timeRemaining <= 10) {
                    timerFill.style.background = '#ff0055';
                    if(gameState.timeRemaining > 0) AudioEngine.playSynthTone(1200, 0.1);
                } else if (pct <= 30) { 
                    timerFill.style.background = 'var(--primary-gold)'; 
                } else { 
                    timerFill.style.background = 'linear-gradient(90deg, var(--neon-red), var(--primary-gold), #4cd964)'; 
                }

                if (gameState.timeRemaining <= 0) { 
                    clearInterval(gameState.timerIntv); 
                    handleTimeOut(); 
                }
            }, 1000);
        } else {
            timerFill.style.width = '100%'; 
            timerFill.style.background = '#4cd964';
            gameState.timerIntv = setInterval(() => {
                gameState.timeElapsed++;
                const m = String(Math.floor(gameState.timeElapsed / 60)).padStart(2, '0');
                const s = String(gameState.timeElapsed % 60).padStart(2, '0');
                txtTimer.textContent = `${m}:${s}`;
            }, 1000);
        }
    }

    function autoCompleteBoard(pState) {
        for(let i=0; i<pState.pieces.length; i++) {
            pState.pieces[i] = i;
        }
        updateVisuals(pState);
        const isP1 = pState.boardId === 'board-p1';
        document.getElementById(isP1 ? 'score-p1' : 'score-p2').textContent = '100%';
    }

    function handleTimeOut() {
        gameState.isPlaying = false;
        AudioEngine.stopInstrumentSound();
        document.querySelectorAll('.quiz-panel').forEach(p => p.remove());

        let p1Score = getProgress(gameState.p1), p2Score = getProgress(gameState.p2);
        if (gameState.p1.quizActive) p1Score = 100;
        if (gameState.p2.quizActive) p2Score = 100;
        
        if (p1Score > p2Score) { 
            autoCompleteBoard(gameState.p1);
            endGameSequence('p1'); 
        } else if (p2Score > p1Score) { 
            autoCompleteBoard(gameState.p2);
            endGameSequence('p2'); 
        } else { 
            showOriginalEndOverlay('draw'); 
        }
    }

    function resizeBoards() {
        ['p1', 'p2'].forEach(player => {
            const pState = gameState[player];
            const container = document.querySelector(player === 'p1' ? '.left-table' : '.right-table');
            const maxW = container.clientWidth - 40, maxH = container.clientHeight - 40;
            const containerRatio = maxW / maxH, imgRatio = gameState.imgRatio; 
            let boardW, boardH;
            if (imgRatio > containerRatio) { 
                boardW = maxW; boardH = maxW / imgRatio; 
            } else { 
                boardH = maxH; boardW = maxH * imgRatio; 
            }
            const boardEl = document.getElementById(pState.boardId);
            boardEl.style.width = boardW + 'px'; 
            boardEl.style.height = boardH + 'px';
            updateVisuals(pState, boardW, boardH);
        });
    }

    // --- 퍼즐 보드 생성 및 조각 분할 ---
    function initBoard(playerKey) {
        const pState = gameState[playerKey]; 
        const boardEl = document.getElementById(pState.boardId);
        boardEl.innerHTML = ''; 
        pState.pieces = []; 
        pState.domElements = []; 
        pState.isWinner = false; 
        pState.quizActive = false;
        
        const total = gameState.gridSize * gameState.gridSize;
        for (let i = 0; i < total; i++) pState.pieces.push(i);
        
        // 퍼즐 무작위 셔플 (완성 상태 방지)
        do { 
            pState.pieces.sort(() => Math.random() - 0.5); 
        } while (pState.pieces.every((val, i) => val === i));

        for (let pieceId = 0; pieceId < total; pieceId++) {
            const pieceEl = document.createElement('div');
            pieceEl.className = 'puzzle-piece'; 
            pieceEl.dataset.player = playerKey; 
            pieceEl.dataset.pieceId = pieceId;
            
            const origRow = Math.floor(pieceId / gameState.gridSize), origCol = pieceId % gameState.gridSize;
            const bgPosX = gameState.gridSize > 1 ? (origCol / (gameState.gridSize - 1)) * 100 : 0;
            const bgPosY = gameState.gridSize > 1 ? (origRow / (gameState.gridSize - 1)) * 100 : 0;
            
            pieceEl.style.backgroundImage = `url('${gameState.imgData.image_path}'), url('img/violin.webp')`;
            pieceEl.style.backgroundSize = `${gameState.gridSize * 100}% ${gameState.gridSize * 100}%`;
            pieceEl.style.backgroundPosition = `${bgPosX}% ${bgPosY}%`;
            
            attachDragEvents(pieceEl, pState);
            pState.domElements[pieceId] = pieceEl; 
            boardEl.appendChild(pieceEl);
        }
    }

    function updateVisuals(pState, boardW, boardH) {
        if (!pState.domElements || pState.domElements.length === 0) return;
        const boardEl = document.getElementById(pState.boardId);
        const currentBoardW = boardW || boardEl.clientWidth, currentBoardH = boardH || boardEl.clientHeight;
        const pieceW = currentBoardW / gameState.gridSize, pieceH = currentBoardH / gameState.gridSize;
        
        for (let slotIndex = 0; slotIndex < pState.pieces.length; slotIndex++) {
            const pieceEl = pState.domElements[pState.pieces[slotIndex]];
            pieceEl.style.width = pieceW + 'px'; 
            pieceEl.style.height = pieceH + 'px';
            pieceEl.style.left = ((slotIndex % gameState.gridSize) * pieceW) + 'px'; 
            pieceEl.style.top = (Math.floor(slotIndex / gameState.gridSize) * pieceH) + 'px';
            pieceEl.dataset.slotIndex = slotIndex;
        }
    }

    // --- 조각 드래그 앤 드롭 제어 ---
    let activeDrags = {};
    function attachDragEvents(pieceEl, pState) {
        pieceEl.addEventListener('pointerdown', (e) => {
            if (!gameState.isPlaying || pState.quizActive) return; 
            e.preventDefault();
            pieceEl.setPointerCapture(e.pointerId); 
            pieceEl.classList.add('dragging');
            activeDrags[e.pointerId] = { el: pieceEl, pState: pState, slotIndex: parseInt(pieceEl.dataset.slotIndex), startX: e.clientX, startY: e.clientY };
        });
        
        pieceEl.addEventListener('pointermove', (e) => {
            const drag = activeDrags[e.pointerId]; 
            if (!drag) return;
            drag.el.style.transform = `translate(${e.clientX - drag.startX}px, ${e.clientY - drag.startY}px) scale(1.05)`;
        });
        
        const drop = (e) => {
            const drag = activeDrags[e.pointerId]; 
            if (!drag) return;
            
            drag.el.releasePointerCapture(e.pointerId); 
            drag.el.style.transform = ''; 
            drag.el.classList.remove('dragging');
            
            const boardEl = document.getElementById(pState.boardId), rect = boardEl.getBoundingClientRect();
            let targetCol = Math.max(0, Math.min(gameState.gridSize - 1, Math.floor((e.clientX - rect.left) / (boardEl.clientWidth / gameState.gridSize))));
            let targetRow = Math.max(0, Math.min(gameState.gridSize - 1, Math.floor((e.clientY - rect.top) / (boardEl.clientHeight / gameState.gridSize))));
            const tIdx = targetRow * gameState.gridSize + targetCol;
            
            if (tIdx !== drag.slotIndex) {
                const temp = pState.pieces[tIdx]; 
                pState.pieces[tIdx] = pState.pieces[drag.slotIndex]; 
                pState.pieces[drag.slotIndex] = temp;
                AudioEngine.playClack();
            }
            
            updateVisuals(pState); 
            checkProgress(pState); 
            delete activeDrags[e.pointerId];
        };
        pieceEl.addEventListener('pointerup', drop); 
        pieceEl.addEventListener('pointercancel', drop);
    }

    function getProgress(pState) {
        let correctCount = 0; 
        for (let i = 0; i < pState.pieces.length; i++) { 
            if (pState.pieces[i] === i) correctCount++; 
        }
        return Math.floor((correctCount / pState.pieces.length) * 100);
    }

    // --- 퍼즐 100% 매치 검사 ---
    function checkProgress(pState) {
        if(pState.isWinner || pState.quizActive) return;
        const percentage = getProgress(pState), isP1 = pState.boardId === 'board-p1';
        document.getElementById(isP1 ? 'score-p1' : 'score-p2').textContent = `${percentage}%`;
        
        if (percentage === 100) { 
            pState.quizActive = true;
            // 퍼즐을 100% 맞추면, 즉시 악기 소리를 10초간 재생
            AudioEngine.playInstrumentSound(gameState.imgData.sample_path);
            showInstrumentQuiz(pState);
        }
    }

    // --- 악기 종류 맞추기 퀴즈 (관/현/타악기 3지선다) ---
    function showInstrumentQuiz(pState) {
        const boardEl = document.getElementById(pState.boardId);
        const quizPanel = document.createElement('div');
        quizPanel.className = 'quiz-panel';
        quizPanel.innerHTML = `
            <div class="quiz-title">${i18n[currentGlobalLang].quiz_q}</div>
            <div class="quiz-btn-group">
                <button class="quiz-btn" onpointerdown="answerQuiz('${pState.boardId}', '관악기')">${i18n[currentGlobalLang].btn_wind}</button>
                <button class="quiz-btn" onpointerdown="answerQuiz('${pState.boardId}', '현악기')">${i18n[currentGlobalLang].btn_string}</button>
                <button class="quiz-btn" onpointerdown="answerQuiz('${pState.boardId}', '타악기')">${i18n[currentGlobalLang].btn_percussion}</button>
            </div>
        `;
        boardEl.appendChild(quizPanel);
    }

    // --- 정오답 판정 및 음악 제어 ---
    function answerQuiz(boardId, answer) {
        const isP1 = boardId === 'board-p1';
        const playerKey = isP1 ? 'p1' : 'p2';
        const pState = gameState[playerKey];

        // 퀴즈 결과에 관계없이 우선 재생 중인 악기 소리는 정지
        AudioEngine.stopInstrumentSound();

        if (gameState.imgData.category === answer) {
            // 정답 시
            AudioEngine.playStart();
            const panel = document.querySelector(`#${boardId} .quiz-panel`);
            if(panel) panel.remove();
            
            pState.isWinner = true;
            
            // 정답 피드백 효과음 직후 악기 소리를 10초간 재재생
            setTimeout(() => {
                AudioEngine.playInstrumentSound(gameState.imgData.sample_path);
            }, 500);

            endGame(playerKey);
        } else {
            // 오답 시
            AudioEngine.playWrong();
            
            // 피드백 팝업 생성
            const boardEl = document.getElementById(boardId);
            const feedbackMsg = document.createElement('div');
            feedbackMsg.className = 'wrong-feedback';
            const thinkAgainTranslations = {
                'ko': '다시 생각해 보세요', 'en': 'Think again', 'zh': '请再想想', 'ja': 'もう一度考えてみてください',
                'es': 'Piénsalo otra vez', 'fr': 'Réfléchissez encore', 'de': 'Denk noch mal nach', 'it': 'Pensaci ancora',
                'pt-br': 'Pense novamente', 'ru': 'Подумайте еще раз', 'hi': 'फिर से सोचें', 'bn': 'আবার ভাবুন',
                'id': 'Pikirkan lagi', 'vi': 'Hãy nghĩ lại', 'th': 'ลองคิดดูอีกที', 'tr': 'Tekrar düşünün'
            };
            feedbackMsg.textContent = thinkAgainTranslations[currentGlobalLang] || thinkAgainTranslations['en'];
            boardEl.appendChild(feedbackMsg);

            setTimeout(() => {
                if (feedbackMsg.parentNode) feedbackMsg.remove();
            }, 2000);
            
            // 퀴즈 패널 제거 및 퀴즈 상태 초기화
            const panel = document.querySelector(`#${boardId} .quiz-panel`);
            if (panel) panel.remove();
            pState.quizActive = false;
            
            // 오답 패널티: 0번과 1번 퍼즐조각 셔플하여 완성률 깎음
            if (pState.pieces.length >= 2) {
                const temp = pState.pieces[0];
                pState.pieces[0] = pState.pieces[1];
                pState.pieces[1] = temp;
            }
            
            updateVisuals(pState);
            checkProgress(pState);
        }
    }

    function endGame(winnerCode) {
        if (!gameState.isPlaying) return;
        gameState.isPlaying = false; 
        
        if (winnerCode === 'draw') {
            showOriginalEndOverlay('draw');
        } else {
            endGameSequence(winnerCode);
        }
    }

    function endGameSequence(winnerCode) {
        if(gameState.timerIntv) clearInterval(gameState.timerIntv); 
        document.querySelectorAll('.quiz-panel').forEach(p => p.remove());

        AudioEngine.playSynthTone(880, 0.15);
        setTimeout(() => AudioEngine.playSynthTone(1320, 0.4), 150);
        
        const winnerBoardId = winnerCode === 'p1' ? 'board-p1' : 'board-p2';
        const winnerPieces = document.querySelectorAll(`#${winnerBoardId} .puzzle-piece`);
        winnerPieces.forEach(p => p.style.border = 'none'); 

        triggerFireworks(winnerCode);

        setTimeout(() => {
            showInstrumentInfoOnLoserSide(winnerCode);
        }, 1000);
    }

    function triggerFireworks(winnerCode) {
        const boardId = winnerCode === 'p1' ? 'board-p1' : 'board-p2';
        const boardEl = document.getElementById(boardId);
        const rect = boardEl.getBoundingClientRect();
        
        const x = (rect.left + rect.width / 2) / window.innerWidth;
        const y = (rect.top + rect.height / 2) / window.innerHeight;

        const duration = 1000;
        const end = Date.now() + duration;

        (function frame() {
            confetti({
                particleCount: 6,
                angle: 60,
                spread: 55,
                origin: { x: x - 0.05, y: y },
                colors: ['#ff0055', '#ffd700', '#ffffff'],
                zIndex: 1000
            });
            confetti({
                particleCount: 6,
                angle: 120,
                spread: 55,
                origin: { x: x + 0.05, y: y },
                colors: ['#00f0ff', '#4cd964', '#ffffff'],
                zIndex: 1000
            });

            if (Date.now() < end) {
                requestAnimationFrame(frame);
            }
        }());
    }

    // --- 패배팀 화면에 악기 설명 팝업 표시 ---
    function showInstrumentInfoOnLoserSide(winnerCode) {
        const loserBoardId = winnerCode === 'p1' ? 'board-p2' : 'board-p1';
        const loserBoard = document.getElementById(loserBoardId);
        
        const infoPanel = document.createElement('div');
        infoPanel.className = 'info-panel';
        
        const item = gameState.imgData;
        const title = getLocalizedInstrumentName(item.id, item.name);
        const categoryText = getLocalizedCategory(item.category);
        const desc = item.description || "";
        let retryText = i18n[currentGlobalLang].btn_retry;

        infoPanel.innerHTML = `
            <div class="info-content">
                <div class="info-title">${title}</div>
                <div class="info-category">${categoryText}</div>
                <div class="info-desc">${desc}</div>
                <button class="diff-btn resize-text mt-4" onclick="document.getElementById('btn-home').click()" style="pointer-events: auto;">
                    ${retryText}
                </button>
            </div>
        `;
        
        loserBoard.appendChild(infoPanel);
        
        requestAnimationFrame(() => {
            infoPanel.classList.add('visible');
        });
    }

    function showOriginalEndOverlay(winnerCode) {
        if(gameState.timerIntv) clearInterval(gameState.timerIntv); 
        
        const endOverlay = document.getElementById('overlay-end');
        const winTitle = document.getElementById('win-title');
        
        if (winnerCode === 'draw') {
            winTitle.textContent = i18n[currentGlobalLang].draw;
            winTitle.style.webkitTextFillColor = '#ffffff';
        }
        
        endOverlay.classList.remove('hidden');
    }

    document.getElementById('btn-home').addEventListener('click', () => {
        AudioEngine.stopInstrumentSound(); // 사운드 강제 정지
        const infoPanels = document.querySelectorAll('.info-panel');
        infoPanels.forEach(p => p.remove());

        gameState.isPlaying = false;
        if(gameState.timerIntv) clearInterval(gameState.timerIntv);
        document.getElementById('overlay-start').classList.remove('hidden');
        document.getElementById('overlay-end').classList.add('hidden');
        document.getElementById('overlay-countdown').classList.add('hidden');
        
        document.getElementById('board-p1').innerHTML = '';
        document.getElementById('board-p2').innerHTML = '';
        document.getElementById('score-p1').textContent = '0%';
        document.getElementById('score-p2').textContent = '0%';

        // 다국어 선택기 버튼 다시 표시
        document.getElementById('langSelectorContainer').style.display = 'block';
    });

    function toggleFullscreen() {
        if (!document.fullscreenElement) { 
            document.documentElement.requestFullscreen().catch(err => console.log(err)); 
        } else if (document.exitFullscreen) { 
            document.exitFullscreen(); 
        }
    }

    // --- 다국어 강제 로딩 및 갤러리 기동 ---
    applyTranslations(currentGlobalLang);
    setAppHeight();
</script>
</body>
